[project]
name = "ccp-backend"
version = "0.1.0"
description = "Cloud Security Control Engineering Platform - local MVP backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.3",
    "sqlalchemy>=2.0.40,<2.1",
    "alembic>=1.14,<1.17",
    "psycopg[binary]>=3.2,<3.4",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.6,<2.10",
    # Optional AI-assisted workspace mode only. Imported lazily; nothing calls it unless
    # WORKSPACE_AI_PROVIDER=anthropic and an API key are configured.
    "anthropic>=1.12,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
